name: Deploy (Production)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: byinlinm-front # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: "dist" # Set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: "22" # Set this to the node version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      # Check out the repo
      - name: "Checkout GitHub Action"
        uses: actions/checkout@main

      - name: Check current directory
        run: |
          pwd
          ls -la

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        run: |
          npx get-pnpm

      - name: "Installation and build"
        run: |
          pnpm install --frozen-lockfile
          pnpm build --if-present

      - name: Prepare release package
        run: |
          mkdir -p release-package
          cp -r dist release-package/
          cp package.json pnpm-lock.yaml release-package/
          cp -r node_modules release-package/

      - name: Verify devalue dependency
        run: |
          pnpm why devalue
          ls -la release-package/node_modules/devalue

      # Deploy web app by using Azure credentials
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Azure logout
      - name: logout
        run: |
          az logout
